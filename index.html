            let tokens = text.split(/(\s+)/);
            let out = [];

            let coreFn;
            if (mode === 'wugniu') coreFn = (s) => convertCore(s);
            else if (mode === 'ipa-sinitic') coreFn = (s) => wugniuToIpaCore(s, 'sinitic');
            else if (mode === 'ipa-broad') coreFn = (s) => wugniuToIpaCore(s, 'broad');

            for (let t of tokens) {
                if (!t) continue;
                if (/^\s+$/.test(t)) {
                    out.push(t);
                } else {
                    out.push(extractAndConvert(t, coreFn));
                }
            }
            return out.join("");
        }

        // UI Event Listeners
        const inputSinitic = document.getElementById("input-sinitic");
        const inputBroad = document.getElementById("input-broad");
        const inputWugniu = document.getElementById("input-wugniu");

        const copyBtnSinitic = document.getElementById("copy-btn-sinitic");
        const copyBtnBroad = document.getElementById("copy-btn-broad");
        const copyBtnWugniu = document.getElementById("copy-btn-wugniu");

        const inputTone = document.getElementById("input-tone");
        inputTone.dataset.plain = "";
        const outputTone = document.getElementById("output-tone");
        const copyBtnToneIn = document.getElementById("copy-btn-tone-in");
        const copyBtnToneOut = document.getElementById("copy-btn-tone-out");

        let isSyncing = false; // Flag to prevent infinite sync loops

        function autoResize(el) {
            el.style.height = '80px';
            if (el.scrollHeight > 80) {
                el.style.height = el.scrollHeight + 'px';
            }
        }

        function resizeAll() {
            autoResize(inputSinitic);
            autoResize(inputBroad);
            autoResize(inputWugniu);
            autoResize(inputTone);
            if (outputTone) drawContinuousToneCurve(outputTone);
        }

        inputSinitic.addEventListener("input", (e) => {
            if (isSyncing) return;
            isSyncing = true;
            let wugniuText = convertAll(e.target.value, 'wugniu');
            inputWugniu.value = wugniuText;
            inputBroad.value = convertAll(wugniuText, 'ipa-broad');
            resizeAll();
            isSyncing = false;
        });

        inputBroad.addEventListener("input", (e) => {
            if (isSyncing) return;
            isSyncing = true;
            let wugniuText = convertAll(e.target.value, 'wugniu');
            inputWugniu.value = wugniuText;
            inputSinitic.value = convertAll(wugniuText, 'ipa-sinitic');
            resizeAll();
            isSyncing = false;
        });

        inputWugniu.addEventListener("input", (e) => {
            if (isSyncing) return;
            isSyncing = true;
            inputSinitic.value = convertAll(e.target.value, 'ipa-sinitic');
            inputBroad.value = convertAll(e.target.value, 'ipa-broad');
            resizeAll();
            isSyncing = false;
        });

        // Skip processing during IME composition: mutating the DOM mid-composition force-commits
        // the in-progress pinyin. Run once on compositionend instead.
        let imeComposing = false;
        inputTone.addEventListener("compositionstart", () => { imeComposing = true; });
        inputTone.addEventListener("compositionend", () => { imeComposing = false; handleToneInputChanged(); });

        // A caret directly between two sibling widgets (no text node there) is a valid position
        // for click/arrow navigation, but the browser has nowhere to insert a typed character —
        // so create a one-character text node right there, on demand, only when the user actually
        // types. Nothing is created just from navigating past it, so arrow keys stay single-press.
        inputTone.addEventListener("beforeinput", (e) => {
            if (imeComposing || e.isComposing) return;
            if (!e.data || e.inputType !== "insertText") return;
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return;
            const range = sel.getRangeAt(0);
            if (!range.collapsed || range.startContainer.nodeType !== 1) return;
            e.preventDefault();
            const container = range.startContainer;
            const ref = container.childNodes[range.startOffset] || null;
            const node = document.createTextNode(e.data);
            container.insertBefore(node, ref);
            const newRange = document.createRange();
            newRange.setStart(node, node.textContent.length);
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);
            handleToneInputChanged();
        });

        inputTone.addEventListener("input", (e) => {
            if (imeComposing || e.isComposing) return;
            handleToneInputChanged();
        });

        // The atomic widget adjacent to the caret in `direction`, or null. Skips blank/ZWSP
        // nodes so a caret placed by navigation still reaches the widget. The browser's own
        // contenteditable=false deletion is unreliable, so the handler below deletes explicitly.
        function widgetAdjacentToCaret(range, direction) {
            const { startContainer: c, startOffset: o } = range;
            let node = null;
            // A caret inside a blank/ZWSP node counts as at the edge either way, so deletion
            // reaches through to the widget.
            const atStartEdge = c.nodeType === 3 && (o === 0 || isBlankTextNode(c));
            const atEndEdge = c.nodeType === 3 && (o === c.textContent.length || isBlankTextNode(c));
            if (direction === "before") {
                if (atStartEdge) node = c.previousSibling;
                else if (c.nodeType === 1 && o > 0) node = c.childNodes[o - 1];
                else return null;
                while (isBlankTextNode(node)) node = node.previousSibling;
            } else {
                if (atEndEdge) node = c.nextSibling;
                else if (c.nodeType === 1 && o < c.childNodes.length) node = c.childNodes[o];
                else return null;
                while (isBlankTextNode(node)) node = node.nextSibling;
            }
            return node;
        }

        inputTone.addEventListener("keydown", (e) => {
            if (e.key !== "Backspace" && e.key !== "Delete") return;
            if (imeComposing || e.isComposing) return; // never intercept keys mid-IME-composition
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return;
            const range = sel.getRangeAt(0);
            if (!range.collapsed) return; // a real selection: let the browser delete it normally

            // Replace a deleted comma/punctuation with a space when it sits between two letters
            // in the same text node, so the syllables stay split (the space becomes a dash). A
            // leading/trailing comma deletes normally. (Between two chips the comma is its own
            // node, deletes natively, and ensureSyllableSeparators re-adds the dash.)
            const cc = range.startContainer;
            if (cc.nodeType === 3) {
                const delIdx = e.key === "Backspace" ? range.startOffset - 1 : range.startOffset;
                const ch = cc.textContent[delIdx];
                if (ch && isDomainBreakChar(ch) && isWordChar(cc.textContent[delIdx - 1]) && isWordChar(cc.textContent[delIdx + 1])) {
                    e.preventDefault();
                    const t = cc.textContent;
                    cc.textContent = t.slice(0, delIdx) + " " + t.slice(delIdx + 1);
                    const r = document.createRange();
                    r.setStart(cc, delIdx + 1);
                    r.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(r);
                    handleToneInputChanged();
                    return;
                }
            }

            const target = widgetAdjacentToCaret(range, e.key === "Backspace" ? "before" : "after");
            if (!target || !isWidgetNode(target)) return;

            e.preventDefault();
            const parent = target.parentNode;
            const anchor = e.key === "Backspace" ? target.previousSibling : target.nextSibling;
            target.remove();

            const newRange = document.createRange();
            if (anchor && anchor.nodeType === 3) {
                newRange.setStart(anchor, e.key === "Backspace" ? anchor.textContent.length : 0);
            } else if (anchor) {
                e.key === "Backspace" ? newRange.setStartAfter(anchor) : newRange.setStartBefore(anchor);
            } else {
                newRange.setStart(parent, 0);
            }
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);
            handleToneInputChanged();
        });

        // Let the browser handle Enter natively (its caret placement is correct), but make it
        // insert a <br> instead of wrapping the new line in a <div> that extractToneInputText
        // can't read; extractToneInputText reads a <br> as "\n".
        try { document.execCommand("defaultParagraphSeparator", false, "br"); } catch (e) { /* unsupported: rare, harmless */ }

        window.addEventListener('resize', resizeAll);

        function setupCopyBtn(btn, box) {
            btn.addEventListener("click", () => {
                const text = box.dataset && box.dataset.plain !== undefined ? box.dataset.plain : box.value;
                navigator.clipboard.writeText(text).then(() => {
                    btn.classList.add("success");

                    setTimeout(() => {
                        btn.classList.remove("success");
                    }, 2000);
                });
            });
        }

        setupCopyBtn(copyBtnSinitic, inputSinitic);
        setupCopyBtn(copyBtnBroad, inputBroad);
        setupCopyBtn(copyBtnWugniu, inputWugniu);
        setupCopyBtn(copyBtnToneIn, inputTone);
        setupCopyBtn(copyBtnToneOut, outputTone);

        // Resize textareas on load
        window.onload = () => {
            resizeAll();
        };
        const SIMP_MAP = {};
        for (const [trad, data] of Object.entries(WUGNIU_DICT)) {
            if (data.s && data.s !== trad) {
                SIMP_MAP[data.s] = trad;
            }
        }

        document.getElementById('lookup-input').addEventListener('input', function (e) {
            const inputVal = e.target.value.trim();
            const resultsDiv = document.getElementById('lookup-results');
            resultsDiv.innerHTML = '';

            if (!inputVal) return;

            const tokens = inputVal.trim().split(/\s+/);
            let allResults = [];

            // 1. Try to match the entire input as a single Wugniu phrase (handles spaces in pronunciations like "zi iau")
            if (/^[a-zA-Z\s\-]+$/.test(inputVal)) {
                const searchStrFull = inputVal.toLowerCase().trim();
                let exactMatches = [];
                for (const [char, data] of Object.entries(WUGNIU_DICT)) {
                    const pIndex = findPronMatch(data, searchStrFull);
                    if (pIndex !== -1) {
                        exactMatches.push({ trad: char, simp: data.s, wugniu: data.p[pIndex], pron_weight: data.pw[pIndex], w: data.w || 0 });
                    }
                }
                if (exactMatches.length > 0) {
                    exactMatches.sort((a, b) => b.pron_weight - a.pron_weight);
                    allResults = exactMatches;
                }
            }

            // 2. If no full phrase match, proceed with token-by-token parsing
            if (allResults.length === 0) {
                tokens.forEach(inputStr => {
                    let tradMatch = inputStr;
                    let foundFull = false;
                    let results = [];

                    if (WUGNIU_DICT[inputStr]) {
                        foundFull = true;
                        tradMatch = inputStr;
                    } else if (SIMP_MAP[inputStr]) {
                        foundFull = true;
                        tradMatch = SIMP_MAP[inputStr];
                    }

                    if (foundFull) {
                        const data = WUGNIU_DICT[tradMatch];
                        data.p.forEach((pron, idx) => {
                            results.push({ trad: tradMatch, simp: data.s, wugniu: pron, pron_weight: data.pw[idx], w: data.w || 0 });
                        });
                    } else if (/^[a-zA-Z\-]+$/.test(inputStr)) {
                        // Wugniu reverse lookup (case-insensitive)
                        let matchedChars = [];
                        const searchStr = inputStr.toLowerCase();
                        for (const [char, data] of Object.entries(WUGNIU_DICT)) {
                            const pIndex = findPronMatch(data, searchStr);
                            if (pIndex !== -1) {
                                matchedChars.push({ trad: char, simp: data.s, wugniu: data.p[pIndex], pron_weight: data.pw[pIndex], w: data.w || 0 });
                            }
                        }
                        // Sort by pronunciation weight descending
                        matchedChars.sort((a, b) => b.pron_weight - a.pron_weight);
                        results = results.concat(matchedChars);
                    } else {
                        let bestWugniuPaths = [[]];
                        let bestTrad = "";
                        let bestSimp = "";
                        let hasValidChar = false;

                        let i = 0;
                        while (i < inputStr.length) {
                            let matched = false;
                            for (let j = inputStr.length; j > i; j--) {
                                const subStr = inputStr.substring(i, j);
                                let tc = subStr;
                                if (WUGNIU_DICT[subStr]) tc = subStr;
                                else if (SIMP_MAP[subStr]) tc = SIMP_MAP[subStr];

                                if (WUGNIU_DICT[tc]) {
                                    hasValidChar = true;
                                    bestTrad += tc;
                                    bestSimp += WUGNIU_DICT[tc].s;
                                    
                                    const maxPw = WUGNIU_DICT[tc].pw[0];
                                    const validProns = WUGNIU_DICT[tc].p.filter((p, idx) => WUGNIU_DICT[tc].pw[idx] === maxPw);
                                    
                                    let newPaths = [];
                                    for (let path of bestWugniuPaths) {
                                        for (let pron of validProns) {
                                            newPaths.push([...path, pron]);
                                        }
                                    }
                                    // Limit to 64 permutations to prevent browser lockup on giant pastes
                                    bestWugniuPaths = newPaths.slice(0, 64);
                                    
                                    i = j; // Advance
                                    matched = true;
                                    break;
                                }
                            }

                            if (!matched) {
                                const c = inputStr[i];
                                bestTrad += c;
                                bestSimp += c;
                                for (let path of bestWugniuPaths) {
                                    path.push(c);
                                }
                                i++;
                            }
                        }

                        if (hasValidChar) {
                            for (let path of bestWugniuPaths) {
                                results.push({ trad: bestTrad, simp: bestSimp, wugniu: path.join(' '), pron_weight: 'N/A', w: 0 });
                            }
                        }
                    }
                    allResults = allResults.concat(results);
                });
            }

            if (allResults.length === 0) {
                resultsDiv.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 20px;">嘸沒結果</div>';
                return;
            }

            const pane = document.createElement('div');
            pane.className = 'pane';

            const headerRow = document.createElement('div');
            headerRow.style.cssText = 'display: flex; background: #fafafa; border-bottom: 1px solid var(--border-color);';
            const hColStyle = "flex: 1; padding: 10px; border-right: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px;";
            const hLastColStyle = "flex: 1; padding: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px;";

            headerRow.innerHTML = `
                <div style="${hColStyle}">漢字</div>
                <div style="${hColStyle}">學堂拼音</div>
                <div style="${hColStyle}">國際音標</div>
                <div style="${hLastColStyle}">權重</div>
            `;
            pane.appendChild(headerRow);

            allResults.forEach((res, index) => {
                const wugniu = applyTsiedoe(res.wugniu);
                const sinitic = convertAll(wugniu, 'ipa-sinitic');

                const row = document.createElement('div');
                const borderBottom = index < allResults.length - 1 ? 'border-bottom: 1px solid var(--border-color);' : '';
                row.style.cssText = `background: white; display: flex; text-align: left; ${borderBottom}`;

                const colStyle = "flex: 1; padding: 12px; padding-bottom: 42px; border-right: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; position: relative; min-width: 0;";
                const lastColStyle = "flex: 1; padding: 12px; padding-bottom: 42px; display: flex; align-items: center; justify-content: center; position: relative; min-width: 0;";

                let charHtml = `<div style="font-weight: 500; font-size: 1.1em; color: var(--text-primary); text-align: center;">${res.trad}</div>`;
                if (res.trad !== res.simp) {
                    charHtml += `<div style="font-weight: 500; font-size: 1.1em; color: var(--text-primary); text-align: center;">${res.simp}</div>`;
                }

                row.innerHTML = `
                    <div style="${colStyle}">
                        <div style="display:flex; flex-direction:column; align-items:center;">
                            ${charHtml}
                        </div>
                    </div>
                    <div style="${colStyle}">
                        <div style="font-weight: 500; font-size: 0.95em; color: var(--text-primary); overflow-wrap: break-word; text-align: center;">${wugniu}</div>
                        <button class="copy-btn" onclick="navigator.clipboard.writeText('${wugniu}'); this.classList.add('success'); setTimeout(()=>{this.classList.remove('success');}, 1500);" style="position: absolute; right: 8px; bottom: 8px; font-size: 0.8em; padding: 0; width: 70px; height: 26px;"><span class="text-default">拷貝</span><span class="text-success">✓</span></button>
                    </div>
                    <div style="${colStyle}">
                        <div style="font-weight: 500; font-size: 0.95em; color: var(--text-primary); font-family: 'Gentium Book Plus', serif; overflow-wrap: break-word; text-align: center;">${sinitic}</div>
                        <button class="copy-btn" onclick="navigator.clipboard.writeText('${sinitic}'); this.classList.add('success'); setTimeout(()=>{this.classList.remove('success');}, 1500);" style="position: absolute; right: 8px; bottom: 8px; font-size: 0.8em; padding: 0; width: 70px; height: 26px;"><span class="text-default">拷貝</span><span class="text-success">✓</span></button>
                    </div>
                    <div style="${lastColStyle}">
                        <div style="font-weight: 500; font-size: 0.95em; color: var(--text-secondary); text-align: center;">${res.pron_weight === 'N/A' ? 'N/A' : res.pron_weight + '%'}</div>
                    </div>
                `;
                pane.appendChild(row);
            });
            resultsDiv.appendChild(pane);
        });
    </script>

</body>

</html>
